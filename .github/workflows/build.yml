name: Build InfoBoard IIS package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and smoke test
        shell: pwsh
        run: ./build.ps1
      - name: Upload IIS deployment package
        uses: actions/upload-artifact@v4
        with:
          name: InfoBoard-IIS
          path: |
            dist/InfoBoard-IIS.zip
            dist/deployment.md
          if-no-files-found: error
